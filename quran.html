<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   quran.html — 3-kolumnslayout: TOC | Lista | Detaljer
   ============================================================ */

.quran-shell{
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 0;
  max-width: 1180px;
  margin: 0 auto;
  min-height: calc(100vh - 100px);
}

/* -------- Vänster: innehållsförteckning -------- */
.toc-panel{
  background: var(--paper-card);
  border-right: 1px solid var(--rule);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.toc-head{
  padding: 16px 18px 10px;
  border-bottom: 1px solid var(--rule);
  flex: none;
}
.toc-head h2{
  margin: 0 0 10px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--emerald-dark);
}
.toc-search{
  position: relative;
}
.toc-search input{
  width: 100%;
  padding: 9px 12px 9px 34px;
  font-family: 'Lora', serif;
  font-size: 0.92rem;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 3px;
}
.toc-search input:focus{
  outline: 2px solid var(--emerald);
  outline-offset: 1px;
}
.toc-search svg{
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: #7a6a4a;
  pointer-events: none;
}

.toc-filter{
  display: flex;
  gap: 4px;
  padding: 8px 18px 10px;
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap;
  flex: none;
}
.toc-filter button{
  background: none;
  border: 1px solid var(--rule);
  padding: 3px 9px;
  font-family: 'Lora', serif;
  font-size: 0.74rem;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.toc-filter button:hover{ color: var(--emerald-dark); border-color: var(--gold); }
.toc-filter button.active{
  background: var(--emerald);
  color: #fff;
  border-color: var(--emerald);
}

.toc-list{
  list-style: none;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}
.toc-list::-webkit-scrollbar{ width: 8px; }
.toc-list::-webkit-scrollbar-thumb{
  background: rgba(216,201,160,0.6);
  border-radius: 4px;
}
.toc-list::-webkit-scrollbar-track{ background: transparent; }

.toc-link{
  display: grid;
  grid-template-columns: 2.4em 1fr auto;
  grid-template-areas:
    "num name meta"
    "num ar   meta";
  align-items: center;
  gap: 0 12px;
  padding: 11px 18px;
  border-bottom: 1px solid rgba(216,201,160,0.4);
  text-decoration: none;
  color: inherit;
  transition: background 0.12s, box-shadow 0.12s;
  position: relative;
}
.toc-link:last-child{ border-bottom: none; }
.toc-link:hover{
  background: rgba(14,92,69,0.06);
  box-shadow: inset 3px 0 0 var(--emerald);
  text-decoration: none;
}
.toc-link:hover .toc-translit{ color: var(--emerald-dark); }
.toc-link:focus-visible{
  outline: 2px solid var(--emerald);
  outline-offset: -2px;
}

.toc-num{
  grid-area: num;
  width: 2em; height: 2em;
  border: 1px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.74rem;
  color: var(--emerald-dark);
  background: var(--paper-card);
  align-self: center;
  transition: background 0.12s;
}
.toc-link:hover .toc-num{
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
}

.toc-name{
  grid-area: name;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.toc-translit{
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--ink);
  transition: color 0.12s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc-swedish{
  font-size: 0.79rem;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.toc-ar{
  grid-area: ar;
  font-family: 'Amiri', serif;
  font-size: 0.95rem;
  color: var(--emerald-dark);
  direction: rtl;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0.85;
}

.toc-meta{
  grid-area: meta;
  font-size: 0.72rem;
  color: var(--ink-soft);
  text-align: right;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.toc-empty{
  padding: 32px 18px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.9rem;
  font-style: italic;
}

/* -------- Höger: info-panel, full höjd -------- */
.info-panel{
  background: var(--paper-card);
  padding: 40px 44px 44px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.info-empty{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 120px);
  text-align: center;
  color: var(--ink-soft);
  padding: 40px 24px;
}
.info-empty .info-orn{
  width: 64px;
  height: 64px;
  color: var(--gold);
  opacity: 0.55;
  margin-bottom: 20px;
}
.info-empty h2{
  font-family: 'Lora', serif;
  font-size: 1.25rem;
  color: var(--emerald-dark);
  margin: 0 0 10px;
  font-weight: 500;
}
.info-empty p{
  margin: 0;
  font-size: 0.98rem;
  max-width: 400px;
  line-height: 1.65;
}
.info-empty .hint{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 22px;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  font-size: 0.85rem;
  color: var(--ink-soft);
}

/* Ifylld info-panel */
.info-head{
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 4px;
}
.info-num{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.6em; height: 2.6em;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  font-size: 0.95rem;
  color: var(--emerald-dark);
  flex: none;
}
.info-title{
  font-size: 1.9rem;
  color: var(--emerald-dark);
  margin: 0;
  line-height: 1.15;
  font-weight: 600;
}
.info-ar-title{
  font-family: 'Amiri', serif;
  font-size: 2.1rem;
  color: var(--emerald-dark);
  direction: rtl;
  text-align: right;
  margin: 14px 0 22px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule);
}
.info-meta{
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  color: var(--ink-soft);
  font-size: 0.95rem;
  margin-bottom: 26px;
}
.info-meta span{
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
}
.info-meta b{
  color: var(--emerald-dark);
  font-weight: 600;
}
.info-desc{
  font-size: 1.05rem;
  color: var(--ink);
  margin: 0 0 28px;
  line-height: 1.7;
}
.info-desc strong{
  color: var(--emerald-dark);
}
.info-actions{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 8px;
}

/* Responsivt */
@media (max-width: 900px){
  .quran-shell{
    grid-template-columns: 1fr;
    gap: 0;
  }
  .toc-panel{
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--rule);
  }
  .toc-list{
    max-height: 50vh;
  }
  .info-panel{
    position: static;
    height: auto;
    padding: 28px 22px;
    order: -1;
  }
  .info-empty{ min-height: 0; padding: 24px 12px; }
  .info-ar-title{ font-size: 1.7rem; }
  .info-title{ font-size: 1.5rem; }
}
@media (max-width: 560px){
  .toc-link{
    padding: 10px 14px;
    grid-template-columns: 2.2em 1fr auto;
    gap: 0 10px;
  }
  .toc-ar{ display: none; }
  .toc-translit{ font-size: 0.92rem; }
  .toc-swedish{ font-size: 0.76rem; }
  .info-head{ gap: 12px; }
  .info-title{ font-size: 1.35rem; }
  .info-ar-title{ font-size: 1.5rem; }
}
</style>
</head>

<main style="padding: 0;">

    <aside class="toc-panel" aria-label="Innehållsförteckning">

        <h2>Öppna en sura</h2>
        <p>
          Alla Koranens 114 suror finns i listan till vänster, på arabiska och svenska,

  </div>

  /* ---- Hämta suralistan ---- */
  let SURAHS = [];
  try {
    SURAHS = await getSurahList();
  } catch(err){
    listEl.innerHTML = `<li class="toc-empty">Kunde inte hämta listan (${err.message}).</li>`;
    return;
  }

  /* ---- Svenska beskrivningar av surorna ---- */
 const SURAH_DESCRIPTIONS = {
    1: "Koranens öppning, läs i varje bön. En bön om vägledning och Guds nåd. Sammanfattar Koranens grundläggande principer.",
    2: "Den längsta suran. Innehåller Tronens vers (āyat al-kursī), skapelseberättelsen och många rättsliga bestämmelser. Uppkallad efter berättelsen om kon (vv. 67–73).",

    6: "Om den rena tron på en Gud, och varningar mot att följa förfädernas avgudadyrkan blint. Tar upp förislamiska vidskepelser om djur.",
    7: "Om höjderna mellan paradiset och helvetet, och berättelser om forna folk som förkastade profeterna. Innehåller berättelsen om Adam, Iblis och profeterna Noa, Lot och Shu'ayb.",
    8: "Om krigsbytet efter slaget vid Badr, och om Guds hjälp till de troende. Fokuserar på slaget vid Badr.",
    9: "Om ånger och om att ta avstånd från förbundsbrytare. En av de sista stora surorna. Den enda suran som inte börjar med Bismillah.",
    10: "Om profeten Jona och Guds nåd mot dem som ångrar sig. Tar upp Koranens uppenbarelse och grundläggande principer.",
    11: "Om profeten Hud och andra forntida folks undergång, och Guds rättvisa. Innehåller berättelser om tidigare profeter.",
    12: "Om Josef — Koranens vackraste berättelse, från dröm till försoning och förlåtelse. Visar Guds outgrundliga vägledning i mänskliga angelägenheter.",
    13: "Om åskan som ett tecken på Guds makt, och om löftet och varningen. Handlar om gudomlig uppenbarelse genom profeter och konsekvenserna av att acceptera eller förkasta.",
    14: "Om profeten Abrahams bön för Mekka och hans kamp mot avgudadyrkan. Uppenbarelse avsedd att leda mänskligheten från mörker till ljus.",
    15: "Om bergslandet Hijr och folket som förkastade profeten Salih. Fokuserar på varningen till dem som förnekar sanningen.",
    16: "Om binas samhälle och Guds många gåvor till människan. Påminner om välsignelser som pekar på Välgöraren.",
    17: "Om nattresan från Mekka till Jerusalem och profetens himmelsfärd. Fokuserar på det muhammedanska budskapets fullständighet.",
    18: "Om grottans folk, Moses och Khidr, och berättelsen om Dhul-Qarnayn — fyra prövningar: tro, rikedom, kunskap och makt. Varje berättelse lär hur man möter fitnah.",
    19: "Om Maria och profeten Isaa födelse, och om Guds nåd mot sina profeter. Visar fulländningen av Guds nåd och människans behov av Honom.",
    20: "Om Moses och Farao, och om att inte överge bönen. Stärker profeten att bära budskapet med tålamod.",
    21: "Om profeterna — från Abraham till Muhammad — och deras gemensamma budskap. Fokuserar på enheten i de gudomliga budskapen.",
    22: "Om vallfärden till Mekka och om tron på uppståndelsen. Handlar om förhärligande och underkastelse inför Gud genom scener av gudomlig storhet.",
    23: "Om de troendes egenskaper och om livet efter döden. Uppmuntrar tro och prisar de troendes egenskaper och belöningar.",
    24: "Om ljuset, om ärbarhet, blygsamhet och hemmets helgd. Fokuserar på renhet och det muslimska samhällets integritet.",
    25: "Om Koranen som skiljer sanning från lögn, och om de troendes egenskaper. Beskriver den Nåderikes tjänare (vv. 63–76).",
    26: "Om poeterna och om sanningens kraft mot tomma ord. Konfronterar dem som framhärdar i att förneka profeten.",

    28: "Om Moses barndom, Faraos förtryck och Guds räddning. Fokuserar på de sanna måtten för makt och värderingar.",
    29: "Om spindelns bo som en bild av falsk trygghet, och om prövningens nödvändighet. Handlar om ståndaktighet och tålamod under prövningar.",

    32: "Om knäböjen och om de troendes nattsömn och bön. Visar tecknen och scenerna av sanning i Koranen.",

  /* ---- Bygg listan: varje rad är en <a> som navigerar direkt ---- */
  listEl.innerHTML = "";
  const linkEls = [];

  SURAHS.forEach(s => {
    const li = document.createElement("li");

    const a = document.createElement("a");
    a.className = "toc-link";
    a.href = `sura.html?sura=${s.number}`;
    a.dataset.num   = String(s.number);
    a.dataset.rev   = s.revelationType === "Meccan" ? "meccan" : "medinan";
    a.dataset.ayahs = String(s.numberOfAyahs);
    a.dataset.name  = (s.englishName || "").toLowerCase();
    a.dataset.sv    = (SURAH_SV[s.number] || "").toLowerCase();

    a.innerHTML = `
      <span class="toc-num">${s.number}</span>
      <span class="toc-name">
        <span class="toc-translit">${s.englishName}</span>
        <span class="toc-swedish">${SURAH_SV[s.number] || s.englishNameTranslation}</span>
      </span>
      <span class="toc-ar">${s.name}</span>
      <span class="toc-meta">${s.numberOfAyahs} · ${s.revelationType === "Meccan" ? "meck." : "medin."}</span>
    `;

    /* Hover → uppdatera info-panelen */
    a.addEventListener("mouseenter", () => showInfo(s));
    a.addEventListener("focus",      () => showInfo(s));

    li.appendChild(a);
    listEl.appendChild(li);
    linkEls.push(a);
  });

  /* ---- Info-panel ---- */
  let lastShown = null;

  function showInfo(s){
    if (lastShown === s.number) return;
    lastShown = s.number;

    const rev = s.revelationType === "Meccan" ? "Meckansk" : "Medinensisk";
    const desc = SURAH_DESCRIPTIONS[s.number] || "";
    const svName = SURAH_SV[s.number] || s.englishNameTranslation;

    infoEl.innerHTML = `
      <header class="info-head">
        <span class="info-num">${s.number}</span>
        <h2 class="info-title">${s.englishName}</h2>
      </header>
      <p class="info-ar-title">${s.name}</p>
      <div class="info-meta">
        <span><b>${s.numberOfAyahs}</b> verser</span>
        <span>${rev}</span>
        <span>Nr <b>${s.number}</b> av 114</span>
      </div>
      <p class="info-desc">
        <strong>${svName}</strong>${desc ? " — " + desc : ""}
      </p>
      <div class="info-actions">
        <a class="btn" href="sura.html?sura=${s.number}">
          Öppna suran
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="vertical-align: middle; margin-left: 6px;">
            <path fill="currentColor" d="M9 5l7 7-7 7z"/>
          </svg>
        </a>
        <a class="btn btn-ghost" href="sura.html?sura=${s.number}#ayah-1">Läs från vers 1</a>
      </div>
    `;
  }

  /* ---- Filtrering + sökning ---- */
  let activeFilter = "all";
  let query = "";

  function applyFilter(){
    let visible = 0;
    linkEls.forEach(a => {
      const matchesFilter =
        activeFilter === "all" ||
        a.dataset.rev === activeFilter ||
        (activeFilter === "short" && Number(a.dataset.ayahs) < 30);
      const matchesQuery =
        !query ||
        a.dataset.name.includes(query) ||
        a.dataset.sv.includes(query) ||
        a.dataset.num === query;
      const show = matchesFilter && matchesQuery;
      a.parentElement.style.display = show ? "" : "none";
      if (show) visible++;
    });

    let empty = listEl.querySelector(".toc-empty-dynamic");
    if (!visible){
      if (!empty){
        empty = document.createElement("li");
        empty.className = "toc-empty toc-empty-dynamic";
        listEl.appendChild(empty);
      }
      empty.textContent = "Inga suror matchar.";
    } else if (empty){
      empty.remove();
    }
  }

  searchIn.addEventListener("input", () => {
    query = searchIn.value.trim().toLowerCase();
    applyFilter();
  });

  filterBtns.forEach(b => {
    b.addEventListener("click", () => {
      activeFilter = b.dataset.filter;
      filterBtns.forEach(x => x.classList.toggle("active", x === b));
      applyFilter();
    });
  });

  /* ---- Om ?sura=… finns i URL:en, visa i info-panelen ---- */
  const p = new URLSearchParams(location.search);
  const wanted = parseInt(p.get("sura"), 10);
  if (Number.isInteger(wanted) && wanted >= 1 && wanted <= 114){
    const s = SURAHS.find(x => x.number === wanted);
    const a = linkEls.find(x => Number(x.dataset.num) === wanted);
    if (s) showInfo(s);
    if (a) a.scrollIntoView({ block: "center" });
  }
})();
</script>
